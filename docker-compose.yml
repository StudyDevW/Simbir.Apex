services:
  simbirapex.backend.serviceui: 
    image: ${DOCKER_REGISTRY-}serviceui_apex:1.0
    container_name: Simbir.Apex.ServiceUI
    depends_on:
      postgres_db:
        condition: service_healthy
    build:
      context: ./Backend
      dockerfile: ServiceUI/Dockerfile
    environment:
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      DATABASE_CONNECT: ${DATABASE_CONNECT}
    ports:
       - "8080:80"
    restart: unless-stopped
  simbirapex.backend.servicemanager: 
    image: ${DOCKER_REGISTRY-}servicemanager_apex:1.0
    container_name: Simbir.Apex.ServiceManager
    depends_on:
      postgres_db_manager:
        condition: service_healthy
    build:
      context: ./Backend/ServiceManager
      dockerfile: ServiceManagerRestAPI/Dockerfile
    environment:
      SUPERUSER_NAME: ${SUPERUSER_NAME}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      DATABASE_CONNECT_M: ${DATABASE_CONNECT_M}
    ports:
       - "8081:80"
    restart: unless-stopped
  simbirapex.backend.servicecollector:
    image: ${DOCKER_REGISTRY-}servicecollector_apex:1.0
    container_name: Simbir.Apex.ServiceCollector
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq_broker:
        condition: service_started
    build:
      context: ./Backend/servicecollector
    environment:
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "8082:80"
    restart: unless-stopped
  simbirapex.backend.serviceagent:
    image: ${DOCKER_REGISTRY-}serviceagent_apex:1.0
    container_name: Simbirapex.Apex.ServiceAgent
    depends_on:
      kafka:
        condition: service_healthy
    build: 
      context: ./Backend/service-agent
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
    ports:
      - "8083:80"
    restart: unless-stopped
  simbirapex.backend.serviceanalyzer:
    image: ${DOCKER_REGISTRY-}serviceanalyzer_apex:1.0
    container_name: Simbirapex.Apex.ServiceAnalyzer
    depends_on:
      rabbitmq_broker:
        condition: service_started
      postgres_db:
        condition: service_healthy
    build: 
      context: ./Backend/service-analyzer
      dockerfile: Dockerfile
    environment:
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      DATABASE_CONNECT: ${DATABASE_CONNECT}
    ports:
      - "8084:80"
    restart: unless-stopped
  simbirapex.backend.serviceanalytics:
    image: ${DOCKER_REGISTRY-}serviceanalytics_apex:1.0
    container_name: Simbirapex.Apex.ServiceAnalytics
    depends_on:
      minio:
        condition: service_healthy
    build: 
      context: ./Backend/serviceanalytics
    environment:
      SERVICE_MANAGER_URL: ${SERVICE_MANAGER_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOIN}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8085:80"
    restart: unless-stopped

  postgres_db:
    image: postgres:17.0-bookworm
    container_name: Simbir.Apex.PostgreSQL
    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:80"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  postgres_db_manager:
    image: postgres:17.0-bookworm
    container_name: Simbir.Apex.PostgreSQL.Manager
    environment:
        POSTGRES_DB: ${POSTGRES_DB_M}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:80"
    volumes:
      - ./postgres_data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: Simbir.Apex.PgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_db
      - postgres_db_manager
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3

  redis_cache:
    image: redis:7.4-bookworm
    container_name: Simbir.Apex.Redis
    environment:
      - REDIS_PASSWORD=root
      - REDIS_USER=admin
      - REDIS_USER_PASSWORD=admin
    ports:
      - "6380:6379"
    volumes:
      - ./redis_cache:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  rabbitmq_broker:
    image: rabbitmq:3-management
    container_name: Simbir.Apex.RabbitMQ
    hostname: rabbitmq
    restart: always
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_data:/var/log/rabbitmq
    ports:
      - 5672:5672
      - 15672:15672

  grafana:
    container_name: Simbir.Apex.Metrics.Grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
      - TZ=${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
  loki:
    container_name: Simbir.Apex.Metrics.Loki
    hostname: loki
    image: grafana/loki:latest
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: Simbir.Apex.Kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: "uw3T0RXpRYq4YvppNxcyqQ"

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - ./kafka_data:/tmp/kraft-storage
    healthcheck:
      test: [ "CMD", "/usr/bin/kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  minio:
    container_name: Simbir.Apex.Minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_root_user
      MINIO_ROOT_PASSWORD: minio_root_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      
  shell:
    build:
      context: ./Frontend/shell
      dockerfile: Dockerfile
    container_name: frontend-shell
    env_file: ./Frontend/shell/.env
    ports:
      - "5000:5000"    

  events:
    build:
      context: ./Frontend/events
      dockerfile: Dockerfile
    container_name: frontend-events
    ports:
      - "5001:5001"    

  alerts:
    build:
      context: ./Frontend/alerts
      dockerfile: Dockerfile
    container_name: frontend-alerts
    ports:
      - "5004:5004"    

  rules:
    build:
      context: ./Frontend/rules
      dockerfile: Dockerfile
    container_name: frontend-rules
    ports:
      - "5003:5003"    

  users:
    build:
      context: ./Frontend/users
      dockerfile: Dockerfile
    container_name: frontend-users
    ports:
      - "5002:5002"    

  analytics:
    build:
      context: ./Frontend/analytics
      dockerfile: Dockerfile
    container_name: frontend-analytics
    ports:
      - "5005:5005"    

volumes:
  rabbitmq_broker: 
  grafana_data:
  minio_data: