services:
  simbirapex.backend.serviceui: 
    image: ${DOCKER_REGISTRY-}serviceui_apex:1.0
    container_name: Simbir.Apex.ServiceUI
    depends_on:
      postgres_db:
        condition: service_healthy
    build:
      context: ./Backend
      dockerfile: ServiceUI/Dockerfile
    environment:
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      DATABASE_CONNECT: ${DATABASE_CONNECT}
    ports:
       - "8080:80"
    restart: unless-stopped
  simbirapex.backend.servicemanager: 
    image: ${DOCKER_REGISTRY-}servicemanager_apex:1.0
    container_name: Simbir.Apex.ServiceManager
    depends_on:
      postgres_db_manager:
        condition: service_healthy
    build:
      context: ./Backend/ServiceManager
      dockerfile: ServiceManagerRestAPI/Dockerfile
    environment:
      SUPERUSER_NAME: ${SUPERUSER_NAME}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      DATABASE_CONNECT_M: ${DATABASE_CONNECT_M}
    ports:
       - "8081:80"
    restart: unless-stopped
  postgres_db:
    image: postgres:17.0-bookworm
    container_name: Simbir.Apex.PostgreSQL
    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:80"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  postgres_db_manager:
    image: postgres:17.0-bookworm
    container_name: Simbir.Apex.PostgreSQL.Manager
    environment:
        POSTGRES_DB: ${POSTGRES_DB_M}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:80"
    volumes:
      - ./postgres_data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: Simbir.Apex.PgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_db
      - postgres_db_manager
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3

  redis_cache:
    image: redis:7.4-bookworm
    container_name: Simbir.Apex.Redis
    environment:
      - REDIS_PASSWORD=root
      - REDIS_USER=admin
      - REDIS_USER_PASSWORD=admin
    ports:
      - "6380:6379"
    volumes:
      - ./redis_cache:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  rabbitmq_broker:
    image: rabbitmq:3-management
    container_name: Simbir.Apex.RabbitMQ
    hostname: rabbitmq
    restart: always
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_data:/var/log/rabbitmq
    ports:
      - 5672:5672
      - 15672:15672

#РЎР±РѕСЂ Рё РІРёР·СѓР°Р»РёР·Р°С†РёСЏ Р»РѕРіРѕРІ
  grafana:
    container_name: Simbir.Apex.Metrics.Grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
      - TZ=${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
  loki:
    container_name: Simbir.Apex.Metrics.Loki
    hostname: loki
    image: grafana/loki:latest
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  rabbitmq_broker: 
  grafana_data: