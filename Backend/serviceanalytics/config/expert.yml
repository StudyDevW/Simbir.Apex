rules:
  - threat_type: bruteforce
    advice:
      - "Проверить журнал аутентификации на массовые неудачные попытки входа."
      - "Временно заблокировать IP-адреса/диапазоны с множественными неудачными попытами."
      - "Включить/усилить политику блокировки после N неудачных попыток и включить MFA для админов."
      - "Провести принудительную смену паролей для скомпрометированных учётных записей."

  - threat_type: network
    advice:
      - "Проверить метрики сетевого канала (latency, packet loss) и логи сетевого оборудования."
      - "Проверить внешние соединения и недавние изменения конфигурации сети."
      - "Если обнаружены аномальные потоки — временно изолировать узлы и собрать дампы трафика для анализа."

  - threat_type: file
    advice:
      - "Проверить операции с файлами: массовые чтения/копирования, удаление и запись на внешние носители."
      - "Отключить/запретить использование съёмных носителей на хосте до завершения расследования."
      - "Проверить доступы пользователей к конфиденциальным ресурсам; сменить ключи/пароли при необходимости."
      - "Запустить поиск утечек в сетевом трафике (эксфильтрация по неизвестным IP/портам)."

  - threat_type: suspicious_activity
    advice:
      - "Проверить последовательность действий пользователя, связанные хосты и время активности."
      - "Проанализировать недавние изменения конфигураций и запуск неизвестных процессов."
      - "Провести аудит прав и выполнить временное ограничение прав для подозрительных учётных записей."
      - "Собрать дополнительные артефакты (логи, дампы памяти) для дальнейшего анализа."
