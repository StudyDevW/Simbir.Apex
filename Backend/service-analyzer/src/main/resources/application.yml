server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: analyzer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres_db:5432/simbirapex}
    username: ${SPRING_DATASOURCE_USERNAME:practice_user}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        hbm2ddl.auto: validate  # только валидация, без создания таблиц
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq_broker}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:user}
    password: ${SPRING_RABBITMQ_PASSWORD:password}

app:
  rabbitmq:
    exchange: events.exchange
    queue: events.queue
    routing-key: events.key
